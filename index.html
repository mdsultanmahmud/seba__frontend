<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheba XYZ</title>
    <!-- web font link  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- reset all css  -->
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <!-- navbar css  -->
    <link rel="stylesheet" href="./assets/css/components/navbar.css" />
    <!-- banner css  -->
    <link rel="stylesheet" href="./assets/css/components/banner.css" />

    <!-- font awesome icons  -->
    <script
      src="https://kit.fontawesome.com/bc49ce5c52.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- navbar starts here  -->
    <section class="seba-navbar__container">
      <nav class="seba-navbar__container__inner seba__container">
        <div class="seba-navbar__left">
          <img src="./assets/images/logo.png" alt="" />
        </div>
        <div class="seba-navbar__right">
          <ul>
            <li><a href="#">All Services</a></li>
            <li><a href="#">Login</a></li>
          </ul>
        </div>
      </nav>
    </section>
    <!-- navbar ends here  -->
    <!-- banner starts here  -->
    <section class="seba__banner__container">
      <div class="seba__banner__container__inner seba__container">
        <h1>Your Personal Assistant</h1>
        <h3>
          One-stop solution for your services. Order any service, anytime.
        </h3>
        <div class="seba__search__bar__container">
          <div class="sheba__location">
            <i class="fa-solid fa-location-dot"></i>
            <p>Gulshan</p>
          </div>
          <div class="seba__search__bar">
            <input type="text" placeholder="Find your service here" autofocus   />
            <span>
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
          </div>
        </div>
      </div>
    </section>
    <!-- banner ends here  -->
  </body>
</html>
